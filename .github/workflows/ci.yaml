name: CI CD Password Manager

on:
  push:
    branches: [ main, "feature/*" ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  test_and_lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - run: flutter analyze

      - run: dart pub outdated --no-dev-dependencies --up-to-date

      - run: flutter test